<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ayyub Bangle Store | Elegance in Every Bangle</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="style.css">

</head><body><!-- Header -->
<header class="header">
    <div class="container nav">

        <a href="#" class="logo">
            <span class="logo-main">Ayyub</span>
            <span class="logo-sub">BANGLE STORE</span>
        </a>

        <nav class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#categories">Collections</a>
            <a href="#products">Shop</a>
            <a href="#about">About Us</a>
        </nav>

        <div class="nav-actions">
            <button class="icon-btn" aria-label="Search">
                <i data-lucide="search"></i>
            </button>

            <button class="icon-btn" aria-label="Wishlist">
                <i data-lucide="heart"></i>
            </button>

            <button class="icon-btn" aria-label="Shopping bag">
                <i data-lucide="shopping-bag"></i>
            </button>

            <button class="menu-btn" aria-label="Open menu">
                <i data-lucide="menu"></i>
            </button>
        </div>

    </div>
</header>


<!-- Hero Section -->
<main>
    <section class="hero">

        <div class="hero-content container">
            <p class="hero-tag">TIMELESS ELEGANCE</p>

            <h1>
                Elegance in<br>
                <em>Every Bangle.</em>
            </h1>

            <p class="hero-description">
                Discover beautiful bangles crafted to add
                a touch of elegance to every special moment.
            </p>

            <a href="#products" class="primary-btn">
                Explore Collection
                <i data-lucide="arrow-right"></i>
            </a>
        </div>

        <div class="hero-visual">
            <img 
                src="https://images.unsplash.com/photo-1617038220319-276d3cfab638?auto=format&fit=crop&w=1000&q=85"
                alt="Elegant jewellery collection"
            >
        </div>

    </section>
</main>


<script src="script.js"></script>

</body>
</html>
